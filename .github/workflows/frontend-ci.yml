name: Lifeboard UI CI

on:
  push:
    branches:
      - 'feat/v0.18.0-living-workspace'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Production build
        run: bun run build
      - name: Domain and component tests
        run: bun run test:all
      - name: Build Storybook
        run: bun run build-storybook
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Browser E2E
        run: bun run test:browser
      - name: Generate README screenshots
        if: github.event_name == 'push'
        run: bun run screenshots
      - name: Commit deterministic lockfile and screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'docs: sync demo screenshots and Bun dependency lockfile'
            git push origin HEAD:feat/v0.18.0-living-workspace
          fi
